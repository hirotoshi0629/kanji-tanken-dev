<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanji Quest v2.6 Flow Check</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.7} .ok{color:green}.ng{color:#b00020}button{font-size:18px;padding:12px 18px}</style>
<h1>v2.6 実使用フロー確認</h1><p>公開後、iPadのSafariでこのページを開き「自動チェック」を押してください。</p>
<button id="go">自動チェック</button><div id="out"></div>
<script>
go.onclick=async()=>{const out=document.querySelector('#out');let rows=[];
try{let r=await fetch('./data/reviewed_problem_bank.json',{cache:'no-store'});let b=await r.json();
rows.push(['問題バンク読込',r.ok]);rows.push(['問題数3000以上',(b.questions||[]).length>=3000]);
let reviewed=(b.questions||[]).filter(q=>q.reviewStatus==='reviewed');
rows.push(['通常出題問題あり',reviewed.length>0]);
rows.push(['熟語問題あり',reviewed.some(q=>q.questionType==='compound')]);
rows.push(['手書き判定対象あり',reviewed.some(q=>q.handwritingAnswer)]);
}catch(e){rows.push(['問題バンク読込',false])}
for(const f of ['app.js','styles.css','service-worker.js']){try{let r=await fetch('./'+f,{cache:'no-store'});rows.push([f,r.ok])}catch(e){rows.push([f,false])}}
out.innerHTML=rows.map(x=>`<p class="${x[1]?'ok':'ng'}">${x[1]?'✓':'✗'} ${x[0]}</p>`).join('')};
</script></html>
