<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2066読み カバレッジ診断</title>
<style>
body{font-family:-apple-system,"Yu Gothic",sans-serif;background:#f4f7f3;color:#173322;padding:22px}
main{max-width:980px;margin:auto}
.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #163b2314}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{padding:16px;border-radius:16px;background:#eef8f1}
.big{font-size:32px;font-weight:900}
.ok{color:#087640}.warn{color:#a05c00}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e4ebe6;text-align:left}
</style>
</head>
<body><main>
<h1>📚 2066読み カバレッジ診断</h1>
<div id="summary" class="card">読み込み中…</div>
<div class="card"><h2>巻別ターゲット</h2><div id="volumes"></div></div>
<div class="card">
<h2>完成条件</h2>
<p>1026字 / 2066読みの全ターゲットに、学年・巻・読みが一致したレビュー済み問題が存在し、
先取り0件・解答範囲不一致0件になった時だけ「完全網羅」と判定します。</p>
</div>
<script>
Promise.all([
 fetch("./data/reading_targets_2066.json",{cache:"no-store"}).then(r=>r.json()),
 fetch("./data/reviewed_problem_bank.json",{cache:"no-store"}).then(r=>r.json())
]).then(([m,b])=>{
 const ts=m.targets, covered=ts.filter(x=>x.questionCoverageStatus==="reviewed").length;
 summary.innerHTML=`<div class="grid">
 <div class="stat"><div>漢字</div><div class="big">${m.metadata.uniqueKanjiCount}/1026</div></div>
 <div class="stat"><div>読みターゲット</div><div class="big">${m.metadata.readingTargetCount}/2066</div></div>
 <div class="stat"><div>レビュー済み読み</div><div class="big ${covered===2066?'ok':'warn'}">${covered}/2066</div></div>
 <div class="stat"><div>児童用レビュー済み問題</div><div class="big">${b.questions.length}</div></div>
 </div>`;
 const order=["一上","一下","二上","二下","三上","三下","四上","四下","五","六"];
 volumes.innerHTML="<table><tr><th>巻</th><th>読みターゲット</th><th>レビュー済み</th></tr>"+
 order.map(v=>{const all=ts.filter(x=>x.firstVolume===v).length, ok=ts.filter(x=>x.firstVolume===v&&x.questionCoverageStatus==="reviewed").length;
 return `<tr><td>${v}</td><td>${all}</td><td>${ok}</td></tr>`}).join("")+"</table>";
}).catch(e=>summary.textContent="教材データを読み込めませんでした。");
</script>
</main></body></html>
