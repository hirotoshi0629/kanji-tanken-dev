<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先生 初回設定</title><link rel="stylesheet" href="./styles.css"><style>main{max-width:620px;margin:auto;padding:24px}.card{background:#fff;padding:22px;border-radius:18px}input{display:block;width:100%;box-sizing:border-box;min-height:48px;margin:8px 0 16px;font-size:17px}</style></head><body><main><div class="card"><h1>👩‍🏫 先生用 初回設定</h1><p>学校ごとに最初の管理者を1人作ります。学校コードは児童用URLにも使います。実名は不要です。</p><label>セットアップ秘密鍵<input id="secret" type="password"></label><label>学校コード（例：sakura-e）<input id="school" ></label><label>学校表示名（任意）<input id="schoolName" placeholder="例：さくら小"></label><label>教師ID（英数字）<input id="id" autocomplete="username"></label><label>自分のログインパスワード（10文字以上）<input id="pw" type="password" autocomplete="new-password"></label><button id="go">この学校の管理者を作成</button><p id="msg"></p></div></main><script>document.getElementById('go').onclick=async()=>{let r=await fetch('/api/teacher-setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setupSecret:secret.value,schoolCode:school.value,schoolName:schoolName.value,teacherId:id.value,password:pw.value})});let d=await r.json();msg.textContent=r.ok?'作成しました。teacher.html からログインしてください。':(d.error||'失敗しました。')};</script></body></html>
