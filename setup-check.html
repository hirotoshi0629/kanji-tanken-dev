<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>かん字たんけん 接続チェック</title>
<style>
body{font-family:-apple-system,"Yu Gothic",sans-serif;background:#f5f7f3;padding:24px}
main{max-width:720px;margin:auto;background:white;padding:24px;border-radius:22px}
input,button{width:100%;min-height:52px;margin:7px 0;padding:10px;border-radius:13px;font-size:16px}
button{border:0;background:#18864b;color:white;font-weight:800}.ok{color:#087640}.bad{color:#a35d00}
</style></head>
<body><main>
<h1>🧪 AI接続チェック</h1>
<p>児童配布前に先生が使う確認ページです。</p>
<input id="url" type="url" placeholder="https://...vercel.app/api/recognize">
<button id="test">接続を確認</button>
<p id="result"></p>
<script>
test.onclick=async()=>{
 result.className="";result.textContent="確認中…";
 try{
  const r=await fetch(url.value.trim());
  const j=await r.json();
  if(r.ok&&j.status==="ok"){result.className="ok";result.textContent="✅ AIバックエンドに接続できました。";}
  else throw new Error();
 }catch(e){result.className="bad";result.textContent="⚠️ 接続できません。URL・Vercel・CORS設定を確認してください。";}
};
</script>
</main></body></html>
